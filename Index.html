
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#050817">
<title>METEOR RUN</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #050817;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  touch-action: none;
}

#game {
  width: 100%;
  height: 100dvh;
  display: block;
  background: #050817;
  touch-action: none;
}

#hud {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  pointer-events: none;
  z-index: 2;
}

.stat {
  background: rgba(12,20,43,.85);
  border: 1px solid #33466b;
  border-radius: 12px;
  padding: 9px 13px;
  text-align: center;
  min-width: 75px;
}

.stat small {
  display: block;
  color: #9db4d9;
  font-size: 10px;
  margin-bottom: 4px;
}

.stat strong {
  font-size: 19px;
}

#controls {
  position: absolute;
  top: 100px;
  right: 15px;
  z-index: 3;
}

button {
  border: 1px solid #6686bb;
  background: rgba(18,30,58,.9);
  color: white;
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: bold;
  margin-left: 5px;
  cursor: pointer;
}

#overlay {
  position: absolute;
  inset: 0;
  background: rgba(3,7,20,.86);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 5;
  padding: 25px;
}

.panel {
  width: 100%;
  max-width: 360px;
  text-align: center;
  background: #111b34;
  border: 1px solid #526b9c;
  border-radius: 22px;
  padding: 30px 22px;
  box-shadow: 0 0 45px #244c8b44;
}

.panel h1 {
  font-size: 34px;
  color: #f5bd62;
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.panel p {
  color: #bdcbe3;
  line-height: 1.6;
  margin: 15px 0;
}

.main-btn {
  width: 100%;
  padding: 15px;
  background: #e59d37;
  color: #11182c;
  border: none;
  border-radius: 12px;
  font-size: 17px;
  font-weight: bold;
  margin-top: 12px;
}

.hidden {
  display: none !important;
}

#progress {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 5px;
  background: #26344f;
  z-index: 3;
}

#progressFill {
  width: 100%;
  height: 100%;
  background: #f5bd62;
}

</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="stat">
    <small>LEVEL</small>
    <strong id="level">1</strong>
  </div>
  <div class="stat">
    <small>TIME</small>
    <strong id="time">30</strong>
  </div>
  <div class="stat">
    <small>SCORE</small>
    <strong id="score">0</strong>
  </div>
</div>

<div id="controls">
  <button id="pauseBtn">PAUSE</button>
</div>

<div id="progress">
  <div id="progressFill"></div>
</div>

<div id="overlay">
  <div class="panel">
    <h1>METEOR RUN</h1>
    <p>🚀 Your mission begins here.</p>
    <p>
      Pilot your rocket through deep space.
      Avoid incoming meteorites.
      Survive every level to progress.
    </p>
    <p><strong>CONTROLS</strong><br>
      Hold and move your finger left or right.
    </p>
    <button class="main-btn" id="startBtn">
      START MISSION
    </button>
    <p id="bestText">BEST SCORE: 0</p>
  </div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const levelText = document.getElementById("level");
const timeText = document.getElementById("time");
const scoreText = document.getElementById("score");
const overlay = document.getElementById("overlay");
const startBtn = document.getElementById("startBtn");
const pauseBtn = document.getElementById("pauseBtn");
const progressFill = document.getElementById("progressFill");

let W, H;
let running = false;
let paused = false;
let gameOver = false;

let level = 1;
let score = 0;
let timeLeft = 30;
let elapsed = 0;

let lastTime = 0;
let meteorTimer = 0;
let stars = [];
let meteors = [];
let particles = [];

let bestScore = Number(localStorage.getItem("meteorBest") || 0);

const rocket = {
  x: 0,
  y: 0,
  width: 42,
  height: 58,
  targetX: null
};

function resize() {
  const oldW = W || window.innerWidth;
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;

  rocket.x = Math.min(W - 30, Math.max(30, rocket.x || W / 2));
  rocket.y = H - 105;

  stars = [];

  for (let i = 0; i < 100; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      size: Math.random() * 2 + .3,
      speed: Math.random() * 35 + 10
    });
  }

  if (oldW !== W) {
    rocket.targetX = null;
  }
}

window.addEventListener("resize", resize);
resize();

function drawSpace(dt) {
  ctx.fillStyle = "#050817";
  ctx.fillRect(0, 0, W, H);

  const gradient = ctx.createLinearGradient(0, 0, 0, H);
  gradient.addColorStop(0, "#080d25");
  gradient.addColorStop(1, "#101c38");

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  stars.forEach(star => {
    star.y += star.speed * dt;

    if (star.y > H) {
      star.y = 0;
      star.x = Math.random() * W;
    }

    ctx.fillStyle = "rgba(210,225,255,.8)";
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();
  });

  // Distant planet
  ctx.beginPath();
  ctx.arc(W * .82, H * .27, 39, 0, Math.PI * 2);
  ctx.fillStyle = "#563f78";
  ctx.fill();

  ctx.beginPath();
  ctx.arc(W * .82 - 12, H * .27 - 12, 10, 0, Math.PI * 2);
  ctx.fillStyle = "#86669e";
  ctx.fill();

  // Planet rings
  ctx.beginPath();
  ctx.ellipse(W * .82, H * .27, 62, 13, -.25, 0, Math.PI * 2);
  ctx.strokeStyle = "#a38bb7";
  ctx.lineWidth = 3;
  ctx.stroke();
}

function drawRocket() {
  ctx.save();
  ctx.translate(rocket.x, rocket.y);

  // Flame
  let flicker = Math.random() * 8;

  ctx.beginPath();
  ctx.moveTo(-9, 19);
  ctx.lineTo(0, 36 + flicker);
  ctx.lineTo(9, 19);
  ctx.fillStyle = "#ff762e";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(-4, 20);
  ctx.lineTo(0, 30 + flicker);
  ctx.lineTo(4, 20);
  ctx.fillStyle = "#ffe36b";
  ctx.fill();

  // Side fins
  ctx.beginPath();
  ctx.moveTo(-13, 5);
  ctx.lineTo(-22, 23);
  ctx.lineTo(-10, 19);
  ctx.fillStyle = "#d64b40";
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(13, 5);
  ctx.lineTo(22, 23);
  ctx.lineTo(10, 19);
  ctx.fillStyle = "#d64b40";
  ctx.fill();

  // Rocket body
  ctx.beginPath();
  ctx.moveTo(0, -30);
  ctx.quadraticCurveTo(18, -10, 13, 18);
  ctx.lineTo(-13, 18);
  ctx.quadraticCurveTo(-18, -10, 0, -30);
  ctx.fillStyle = "#eeeeee";
  ctx.fill();

  // Red nose
  ctx.beginPath();
  ctx.moveTo(0, -30);
  ctx.quadraticCurveTo(12, -17, 13, -8);
  ctx.lineTo(-13, -8);
  ctx.quadraticCurveTo(-12, -17, 0, -30);
  ctx.fillStyle = "#e64c45";
  ctx.fill();

  // Window
  ctx.beginPath();
  ctx.arc(0, 1, 7, 0, Math.PI * 2);
  ctx.fillStyle = "#55c8ef";
  ctx.fill();

  ctx.strokeStyle = "#9ee9ff";
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.restore();
}

function spawnMeteor() {
  const radius = 12 + Math.random() * 18;

  meteors.push({
    x: radius + Math.random() * (W - radius * 2),
    y: -radius - 10,
    r: radius,
    speed: 170 + level * 23 + Math.random() * 100,
    rotation: Math.random() * 6,
    spin: (Math.random() - .5) * 2
  });
}

function drawMeteor(m) {
  ctx.save();
  ctx.translate(m.x, m.y);
  ctx.rotate(m.rotation);

  ctx.beginPath();
  ctx.moveTo(-m.r, -m.r * .4);
  ctx.lineTo(-m.r * .5, -m.r);
  ctx.lineTo(m.r * .6, -m.r * .8);
  ctx.lineTo(m.r, -m.r * .2);
  ctx.lineTo(m.r * .7, m.r * .7);
  ctx.lineTo(-m.r * .2, m.r);
  ctx.lineTo(-m.r, m.r * .4);
  ctx.closePath();

  const g = ctx.createRadialGradient(
    -m.r * .3, -m.r * .3, 2, 0, 0, m.r * 1.3
  );

  g.addColorStop(0, "#b9a18b");
  g.addColorStop(.5, "#74584b");
  g.addColorStop(1, "#302c34");

  ctx.fillStyle = g;
  ctx.fill();

  ctx.strokeStyle = "#b87d58";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Craters
  ctx.fillStyle = "#493b39";
  ctx.beginPath();
  ctx.arc(-m.r * .3, 0, m.r * .2, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(m.r * .35, -m.r * .35, m.r * .13, 0, Math.PI * 2);
  ctx.fill();

  ctx.restore();
}

function explode(x, y) {
  for (let i = 0; i < 22; i++) {
    particles.push({
      x,
      y,
      vx: (Math.random() - .5) * 250,
      vy: (Math.random() - .5) * 250,
      life: .7,
      maxLife: .7,
      size: Math.random() * 5 + 2
    });
  }
}

function updateParticles(dt) {
  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.life -= dt;

    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = "#ffad50";
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  particles = particles.filter(p => p.life > 0);
}

function startGame() {
  level = 1;
  score = 0;
  startLevel();
}

function startLevel() {
  timeLeft = 30 + Math.min((level - 1) * 5, 30);
  elapsed = 0;
  meteorTimer = 0;
  meteors = [];
  particles = [];

  rocket.x = W / 2;
  rocket.targetX = null;

  running = true;
  paused = false;
  gameOver = false;

  overlay.classList.add("hidden");
  pauseBtn.textContent = "PAUSE";

  lastTime = performance.now();
  updateHUD();
}

function updateHUD() {
  levelText.textContent = level;
  timeText.textContent = Math.ceil(timeLeft);
  scoreText.textContent = score;
  progressFill.style.width =
    Math.max(0, timeLeft / (30 + Math.min((level - 1) * 5, 30)) * 100) + "%";
}

function finishLevel() {
  running = false;
  level++;

  overlay.classList.remove("hidden");

  overlay.querySelector(".panel").innerHTML = `
    <h1>LEVEL COMPLETE!</h1>
    <p>You survived the meteor field.</p>
    <p>Next mission: LEVEL ${level}</p>
    <p>Score: ${score}</p>
    <button class="main-btn" id="nextBtn">NEXT LEVEL</button>
  `;

  document.getElementById("nextBtn").onclick = startLevel;
}

function endGame() {
  running = false;
  gameOver = true;

  explode(rocket.x, rocket.y);

  if (score > bestScore) {
    bestScore = score;
    localStorage.setItem("meteorBest", bestScore);
  }

  overlay.classList.remove("hidden");

  overlay.querySelector(".panel").innerHTML = `
    <h1>MISSION FAILED</h1>
    <p>Your rocket collided with a meteorite.</p>
    <p>Level reached: ${level}</p>
    <p>Final score: ${score}</p>
    <p>Best score: ${bestScore}</p>
    <button class="main-btn" id="retryBtn">TRY AGAIN</button>
  `;

  document.getElementById("retryBtn").onclick = startGame;
}

function togglePause() {
  if (!running && !paused) return;

  paused = !paused;
  pauseBtn.textContent = paused ? "RESUME" : "PAUSE";

  if (!paused) {
    lastTime = performance.now();
  }
}

pauseBtn.addEventListener("click", togglePause);

function update(dt) {
  if (rocket.targetX !== null) {
    rocket.x += (rocket.targetX - rocket.x) *
      Math.min(1, dt * 13);
  }

  rocket.x = Math.max(25, Math.min(W - 25, rocket.x));

  elapsed += dt;
  timeLeft -= dt;

  meteorTimer += dt;

  const spawnRate = Math.max(.22, .9 - level * .055);

  while (meteorTimer >= spawnRate) {
    meteorTimer -= spawnRate;
    spawnMeteor();
  }

  meteors.forEach(m => {
    m.y += m.speed * dt;
    m.rotation += m.spin * dt;

    const dx = m.x - rocket.x;
    const dy = m.y - rocket.y;

    if (Math.sqrt(dx * dx + dy * dy) < m.r + 17) {
      endGame();
    }
  });

  meteors = meteors.filter(m => {
    if (m.y > H + 40) {
      score += 10;
      return false;
    }
    return true;
  });

  if (timeLeft <= 0 && running) {
    timeLeft = 0;
    updateHUD();
    finishLevel();
  }

  updateHUD();
}

function render(dt) {
  drawSpace(dt);

  meteors.forEach(drawMeteor);

  if (!gameOver) {
    drawRocket();
  }

  updateParticles(dt);
}

function loop(timestamp) {
  const dt = Math.min((timestamp - lastTime) / 1000, .04);
  lastTime = timestamp;

  if (running && !paused) {
    update(dt);
    render(dt);
  } else if (!running) {
    render(0);
  }

  requestAnimationFrame(loop);
}

// Touch and mouse controls

function moveRocket(event) {
  if (!running || paused) return;

  const rect = canvas.getBoundingClientRect();

  rocket.targetX = event.clientX - rect.left;
  rocket.targetX = Math.max(25, Math.min(W - 25, rocket.targetX));
}

canvas.addEventListener("pointerdown", event => {
  if (!running || paused) return;
  canvas.setPointerCapture(event.pointerId);
  moveRocket(event);
});

canvas.addEventListener("pointermove", event => {
  if (event.buttons || event.pointerType === "touch") {
    moveRocket(event);
  }
});

canvas.addEventListener("pointerup", () => {
  rocket.targetX = null;
});

canvas.addEventListener("pointercancel", () => {
  rocket.targetX = null;
});

startBtn.addEventListener("click", startGame);

document.getElementById("bestText").textContent =
  "BEST SCORE: " + bestScore;

requestAnimationFrame(timestamp => {
  lastTime = timestamp;
  requestAnimationFrame(loop);
});

</script>
</body>
</html>
